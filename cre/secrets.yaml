# Secret declarations for the CRE project.
#
# Maps a logical name (used in workflow code via runtime.getSecret) to the
# environment variable that holds the value. The value itself lives in .env,
# which is gitignored — never commit it.
#
# Claimless workflows currently need no secrets: the trigger workflow only reads
# public contract state. This file exists so the structure matches CRE's
# expected project layout and so adding a secret later is a one-line change.

secretsNames: {}
