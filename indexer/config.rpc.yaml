# yaml-language-server: $schema=./node_modules/envio/evm.schema.json
name: claimless-indexer-rpc
description: >-
  Token-free variant of the Claimless indexer: reads from MONAD_RPC_URL instead
  of HyperSync, so no ENVIO_API_TOKEN is required. Slower to backfill, but costs
  nothing and needs no account.

disable_default_cross_chain: true

contracts:
  - name: IncidentRegistry
    abi_file_path: ./abis/IncidentRegistry.json
    handler: ./src/EventHandlers.ts
    events:
      - event: "IncidentReported(uint256 indexed agentId, uint256 indexed incidentId, bytes32 kind, uint8 severity, address indexed reporter)"
      - event: "IncidentChallenged(uint256 indexed incidentId, address indexed challenger)"
      - event: "IncidentFinalized(uint256 indexed incidentId, bool accepted)"
      - event: "ChallengeResolved(uint256 indexed incidentId, bool reportStands, address winner)"
  - name: RiskScore
    abi_file_path: ./abis/RiskScore.json
    handler: ./src/EventHandlers.ts
    events:
      - event: "ScoreUpdated(uint256 indexed agentId, uint256 oldScore, uint256 newScore)"

# RPC data source: no HyperSync token needed. The public Monad testnet RPC caps
# eth_getLogs at a 100-block range, so set a recent start_block when backfill
# would be expensive.
rpc:
  - id: 10143
    start_block: 0
    url: "${MONAD_RPC_URL}"

chains:
  - id: 10143
    start_block: 0
    contracts:
      - name: IncidentRegistry
        address: "${INCIDENT_REGISTRY_ADDRESS}"
      - name: RiskScore
        address: "${RISK_SCORE_ADDRESS}"
