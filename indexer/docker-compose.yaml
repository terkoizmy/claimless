# Claimless self-hosted indexer stack (postgres + hasura + envio-indexer).
# Pattern follows Envio's official local-docker-example.
#
# CRITICAL PORT RULE (this machine):
#   - Postgres host port is 5433 (NOT 5432). Port 5432 is already occupied by
#     the `agentic-scraper-postgres` container and a local Postgres install.
#   - Hasura host port is 8081 (8080 may be taken by other services).
#   - Inside the compose network the services still talk to each other on
#     their standard ports (postgres 5432, hasura 8080); only the host-side
#     mappings are moved.
services:
  envio-postgres:
    image: postgres:17.5
    container_name: claimless-envio-postgres
    restart: always
    # HOST 5433 -> container 5432. Do NOT map to host 5432 (occupied here).
    ports:
      - "${ENVIO_PG_PORT:-5433}:5432"
    volumes:
      - envio-indexer-storage:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: ${ENVIO_PG_PASSWORD:-testing}
      POSTGRES_USER: ${ENVIO_PG_USER:-postgres}
      POSTGRES_DB: ${ENVIO_PG_DATABASE:-envio-dev}
    networks:
      - envio-indexer-network

  graphql-engine:
    image: hasura/graphql-engine:v2.43.0
    container_name: claimless-envio-hasura
    restart: always
    # HOST 8081 -> container 8080. GraphQL console: http://localhost:8081/console
    ports:
      - "${HASURA_EXTERNAL_PORT:-8081}:8080"
    user: 1001:1001
    depends_on:
      - envio-postgres
    environment:
      HASURA_GRAPHQL_DATABASE_URL: postgres://${ENVIO_PG_USER:-postgres}:${ENVIO_PG_PASSWORD:-testing}@envio-postgres:5432/${ENVIO_PG_DATABASE:-envio-dev}
      HASURA_GRAPHQL_ENABLE_CONSOLE: ${HASURA_GRAPHQL_ENABLE_CONSOLE:-true}
      HASURA_GRAPHQL_ENABLED_LOG_TYPES: startup, http-log, webhook-log, websocket-log, query-log
      HASURA_GRAPHQL_NO_OF_RETRIES: 10
      HASURA_GRAPHQL_ADMIN_SECRET: ${HASURA_GRAPHQL_ADMIN_SECRET:-testing}
      HASURA_GRAPHQL_STRINGIFY_NUMERIC_TYPES: "true"
      PORT: 8080
      HASURA_GRAPHQL_UNAUTHORIZED_ROLE: public
    healthcheck:
      test: timeout 1s bash -c ':> /dev/tcp/127.0.0.1/8080' || exit 1
      interval: 5s
      timeout: 2s
      retries: 50
      start_period: 5s
    networks:
      - envio-indexer-network

  envio-indexer:
    container_name: claimless-envio-indexer
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:9898:${ENVIO_INDEXER_PORT:-9898}"
    depends_on:
      graphql-engine:
        condition: service_healthy
    restart: always
    environment:
      ENVIO_PG_PASSWORD: ${ENVIO_PG_PASSWORD:-testing}
      ENVIO_PG_HOST: envio-postgres
      ENVIO_PG_PORT: 5432
      ENVIO_PG_USER: ${ENVIO_PG_USER:-postgres}
      ENVIO_PG_DATABASE: ${ENVIO_PG_DATABASE:-envio-dev}
      ENVIO_PG_PUBLIC_SCHEMA: ${ENVIO_PG_PUBLIC_SCHEMA:-envio}
      ENVIO_INDEXER_HOST: 0.0.0.0
      ENVIO_INDEXER_PORT: ${ENVIO_INDEXER_PORT:-9898}
      # config.yaml (HyperSync, needs ENVIO_API_TOKEN) or config.rpc.yaml
      # (RPC data source, token-free, needs MONAD_RPC_URL).
      CONFIG_FILE: ${CONFIG_FILE:-config.yaml}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_STRATEGY: ${LOG_STRATEGY:-console-pretty}
      HASURA_GRAPHQL_ENDPOINT: http://graphql-engine:8080/v1/metadata
      HASURA_GRAPHQL_ADMIN_SECRET: ${HASURA_GRAPHQL_ADMIN_SECRET:-testing}
      HASURA_SERVICE_HOST: graphql-engine
      HASURA_SERVICE_PORT: 8080
      TUI_OFF: ${TUI_OFF:-true}
      # Indexer inputs (see .env.example):
      ENVIO_API_TOKEN: ${ENVIO_API_TOKEN:-}
      INCIDENT_REGISTRY_ADDRESS: ${INCIDENT_REGISTRY_ADDRESS}
      RISK_SCORE_ADDRESS: ${RISK_SCORE_ADDRESS}
      MONAD_RPC_URL: ${MONAD_RPC_URL:-}
    deploy:
      resources:
        limits:
          cpus: "0.8"
          memory: 800M
    networks:
      - envio-indexer-network

volumes:
  envio-indexer-storage:

networks:
  envio-indexer-network: